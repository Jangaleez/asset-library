<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC0 Asset Library</title>
<meta name="description" content="Free public-domain 3D models (GLB and VRM) for games and animation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0d0f14; --panel: #151922; --panel-2: #1c2130; --line: #262c3d;
    --text: #e8ebf2; --muted: #8b93a7; --accent: #7cf2c4; --accent-ink: #062b1e;
    --vrm: #b79cff; --glb: #6cc4ff; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  header { padding: 40px 0 24px; border-bottom: 1px solid var(--line); }
  .top { display: flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
  h1 { font: 700 clamp(28px, 5vw, 42px)/1.05 'Space Grotesk', sans-serif; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 8px 0 0; max-width: 560px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
         background: var(--panel); color: var(--text); text-decoration: none; font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 20px 0; }
  .search { flex: 1 1 260px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
            color: var(--text); font: inherit; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted);
          font: 500 13px Inter, sans-serif; cursor: pointer; text-transform: capitalize; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding-bottom: 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer;
          text-align: left; padding: 0; color: inherit; font: inherit; transition: transform .15s, border-color .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--muted); outline: none; }
  .thumb { aspect-ratio: 4/3; background: radial-gradient(circle at 50% 40%, var(--panel-2), var(--bg)); display: grid; place-items: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 56px; opacity: .35; }
  .info { padding: 12px 14px 14px; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 2px; gap: 8px; }
  .meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font: 700 11px 'Space Grotesk', sans-serif; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; flex: none; }
  .badge.VRM { color: var(--vrm); background: color-mix(in srgb, var(--vrm) 15%, transparent); }
  .badge.GLB { color: var(--glb); background: color-mix(in srgb, var(--glb) 15%, transparent); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }

  dialog { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
           border-radius: 18px; background: var(--panel); color: var(--text); overflow: hidden; }
  dialog::backdrop { background: rgba(5, 6, 10, .75); backdrop-filter: blur(4px); }
  .viewer { display: grid; grid-template-columns: 1.5fr 1fr; min-height: 480px; }
  model-viewer { width: 100%; height: 100%; min-height: 360px; background: radial-gradient(circle at 50% 40%, #232a3c, #0d0f14); --poster-color: transparent; }
  .details { padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 34px); }
  .details h2 { font: 700 26px/1.1 'Space Grotesk', sans-serif; margin: 0; }
  .by { color: var(--muted); }
  .desc { margin: 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .hash { font: 12px ui-monospace, monospace; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .close { position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; }
  .cc0 { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); }
  @media (max-width: 760px) {
    .viewer { grid-template-columns: 1fr; }
    model-viewer { min-height: 300px; height: 300px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <h1>CC0 <span>Asset</span> Library</h1>
      <p class="sub">Free public-domain 3D models made by the community. Use them in games, animation and anything else — no credit required.</p>
    </div>
    <a class="btn primary" id="submit" href="#">＋ Submit an asset</a>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search names, creators, tags…" aria-label="Search">
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
</main>

<dialog id="modal" aria-labelledby="m-name">
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="viewer">
    <model-viewer id="mv" camera-controls auto-rotate autoplay shadow-intensity="1" touch-action="pan-y" exposure="1"></model-viewer>
    <div class="details">
      <div>
        <h2 id="m-name"></h2>
        <div class="by" id="m-by"></div>
      </div>
      <p class="desc" id="m-desc"></p>
      <div class="tags" id="m-tags"></div>
      <dl>
        <dt>Format</dt><dd id="m-format"></dd>
        <dt>Size</dt><dd id="m-size"></dd>
        <dt>Category</dt><dd id="m-cat" style="text-transform:capitalize"></dd>
        <dt>Licence</dt><dd><span class="cc0">CC0 — public domain</span></dd>
        <dt>SHA-256</dt><dd class="hash" id="m-hash"></dd>
      </dl>
      <div class="actions">
        <a class="btn primary" id="m-dl" download>↓ Download</a>
        <a class="btn" id="m-gh" target="_blank" rel="noopener">View on GitHub</a>
        <button class="btn" id="m-copy">Copy link</button>
      </div>
    </div>
  </div>
</dialog>

<script>
  // Everything from the catalogue is community-submitted, so it is only ever
  // inserted as text (never as HTML).
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const safeUrl = (u) => (typeof u === 'string' && /^(https:\/\/|\.\.\/)/.test(u) ? u : null);
  const fmtSize = (n) => n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
  const CUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>';

  let assets = [], category = 'all', query = '';

  fetch('catalog.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((cat) => {
      assets = cat.assets || [];
      $('submit').href = `https://github.com/${cat.repo}/blob/main/CONTRIBUTING.md`;
      const used = new Set(assets.map((a) => a.category));
      ['all', ...cat.categories.filter((c) => used.has(c))].forEach((c) => {
        const b = el('button', 'chip', c);
        b.setAttribute('aria-pressed', c === category);
        b.onclick = () => { category = c; [...$('chips').children].forEach((x) => x.setAttribute('aria-pressed', x === b)); render(); };
        $('chips').append(b);
      });
      render();
      const hash = decodeURIComponent(location.hash.slice(1));
      const linked = assets.find((a) => a.id === hash);
      if (linked) open(linked);
    })
    .catch(() => { $('grid').replaceChildren(el('div', 'empty', 'Could not load the catalogue.')); });

  $('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  function render() {
    const list = assets.filter((a) =>
      (category === 'all' || a.category === category) &&
      (!query || [a.name, a.creator, a.description, ...(a.tags || [])].join(' ').toLowerCase().includes(query)));
    $('count').textContent = `${list.length} of ${assets.length} assets`;
    if (!list.length) return $('grid').replaceChildren(el('div', 'empty', assets.length ? 'Nothing matches that search.' : 'No assets yet — be the first to submit one!'));
    $('grid').replaceChildren(...list.map(card));
  }

  function card(a) {
    const c = el('button', 'card');
    c.setAttribute('aria-label', `${a.name} by ${a.creator}`);
    const t = el('div', 'thumb');
    const thumb = safeUrl(a.thumbnail);
    if (thumb) { const img = el('img'); img.src = thumb; img.alt = ''; img.loading = 'lazy'; t.append(img); }
    else t.innerHTML = CUBE;
    const info = el('div', 'info');
    info.append(el('div', 'name', a.name));
    const m = el('div', 'meta');
    m.append(el('span', null, a.creator), el('span', `badge ${a.format === 'VRM' ? 'VRM' : 'GLB'}`, a.format));
    info.append(m);
    c.append(t, info);
    c.onclick = () => open(a);
    return c;
  }

  function open(a) {
    $('mv').src = safeUrl(a.model) || '';
    $('mv').poster = safeUrl(a.thumbnail) || '';
    $('m-name').textContent = a.name;
    const by = $('m-by'); by.replaceChildren('by ');
    const link = safeUrl(a.creatorLink);
    if (link) { const l = el('a', null, a.creator); l.href = link; l.target = '_blank'; l.rel = 'noopener nofollow'; by.append(l); }
    else by.append(a.creator);
    $('m-desc').textContent = a.description || '';
    $('m-tags').replaceChildren(...(a.tags || []).map((t) => el('span', 'tag', t)));
    $('m-format').textContent = a.format === 'VRM' ? 'VRM (avatar — VTuber apps, Unity via UniVRM, Blender add-on)' : 'GLB (glTF 2.0 — Blender, Unity, Unreal, Godot, three.js)';
    $('m-size').textContent = fmtSize(a.size);
    $('m-cat').textContent = a.category;
    $('m-hash').textContent = a.sha256;
    $('m-dl').href = safeUrl(a.model) || '#';
    $('m-gh').href = safeUrl(a.page) || '#';
    history.replaceState(null, '', `#${encodeURIComponent(a.id)}`);
    $('modal').showModal();
  }

  $('close').onclick = () => $('modal').close();
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').close(); });
  $('modal').addEventListener('close', () => { $('mv').src = ''; history.replaceState(null, '', location.pathname); });
  $('m-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $('m-copy').textContent = 'Copied!'; }
    catch { $('m-copy').textContent = 'Copy failed'; }
    setTimeout(() => ($('m-copy').textContent = 'Copy link'), 1500);
  };
</script>
</body>
</html>
